name: Build R5C Linux 6.1.84 audio kmods

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib gettext \
            git libelf-dev libncurses5-dev libssl-dev python3-distutils \
            rsync unzip zlib1g-dev file wget xz-utils zstd ca-certificates

      - name: Check out the exact firmware source revision
        run: |
          git clone --filter=blob:none https://github.com/coolsnowwolf/lede.git source
          cd source
          git checkout 7727540c1c9193302b9cfc61212b0cfb09a965b5
          test "$(git rev-parse HEAD)" = "7727540c1c9193302b9cfc61212b0cfb09a965b5"

      - name: Configure only the required kernel packages
        working-directory: source
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_rockchip_armv8_DEVICE_friendlyarm_nanopi-r5c=y
          CONFIG_PACKAGE_kmod-media-core=m
          CONFIG_PACKAGE_kmod-sound-core=m
          CONFIG_PACKAGE_kmod-usb-audio=m
          EOF
          make defconfig
          grep -E '^(CONFIG_TARGET_rockchip|CONFIG_PACKAGE_kmod-(media-core|sound-core|usb-audio))' .config

      - name: Download sources
        working-directory: source
        run: make download -j8

      - name: Build toolchain and kernel packages
        working-directory: source
        run: |
          make tools/install -j"$(nproc)" || make tools/install -j1 V=s
          make toolchain/install -j"$(nproc)" || make toolchain/install -j1 V=s
          make target/linux/compile -j"$(nproc)" || make target/linux/compile -j1 V=s
          make package/kernel/linux/compile -j"$(nproc)" || make package/kernel/linux/compile -j1 V=s

      - name: Collect IPKs and raw modules
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/artifact"
          mkdir -p "$out/ipk" "$out/root"

          find bin -type f \( \
            -name 'kmod-media-core_*.ipk' -o \
            -name 'kmod-sound-core_*.ipk' -o \
            -name 'kmod-usb-audio_*.ipk' \
          \) -exec cp -v {} "$out/ipk/" \;

          test "$(find "$out/ipk" -type f -name '*.ipk' | wc -l)" -eq 3

          for ipk in "$out"/ipk/*.ipk; do
            tmp="$(mktemp -d)"
            (
              cd "$tmp"
              file "$ipk"
              if ar t "$ipk" >/dev/null 2>&1; then
                ar x "$ipk"
              else
                tar -xf "$ipk"
              fi
              data_archive="$(find . -maxdepth 1 -type f -name 'data.tar.*' -print -quit)"
              test -n "$data_archive"
              tar -xf "$data_archive" -C "$out/root"
            )
            rm -rf "$tmp"
          done

          find "$out/root" -type f -name '*.ko' -print | sort > "$out/module-files.txt"
          : > "$out/vermagic.txt"
          while IFS= read -r module; do
            printf '%s: ' "${module#"$out/root/"}" >> "$out/vermagic.txt"
            strings "$module" | grep -m1 '^vermagic=' >> "$out/vermagic.txt"
          done < "$out/module-files.txt"

          grep -q 'vermagic=6.1.84 SMP preempt mod_unload aarch64' "$out/vermagic.txt"
          if grep '^.*vermagic=' "$out/vermagic.txt" | grep -qv 'vermagic=6.1.84 SMP preempt mod_unload aarch64'; then
            echo 'Unexpected vermagic found:' >&2
            cat "$out/vermagic.txt" >&2
            exit 1
          fi

          cp .config "$out/openwrt-build.config"
          git rev-parse HEAD > "$out/source-commit.txt"
          tar -C "$out/root" -czf "$out/audio-kmods-6.1.84-aarch64.tar.gz" .
          sha256sum "$out"/ipk/*.ipk "$out/audio-kmods-6.1.84-aarch64.tar.gz" > "$out/SHA256SUMS"
          cat "$out/vermagic.txt"

      - name: Upload audio modules
        uses: actions/upload-artifact@v4
        with:
          name: r5c-audio-kmods-6.1.84
          path: artifact/
          if-no-files-found: error
          retention-days: 30
